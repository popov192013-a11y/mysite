<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍 Маркетплейс</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        
        .card h3 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        .card .desc {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.5;
            flex-grow: 1;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card .price {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .card .buy {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            transition: opacity 0.2s;
        }
        
        .card .buy:hover {
            opacity: 0.9;
        }
        
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: white;
            font-size: 1.2em;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .loading {
            text-align: center;
            padding: 80px;
            color: white;
            font-size: 1.2em;
        }
        
        .cta {
            text-align: center;
            padding: 40px 20px;
        }
        
        .cta a {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 20px 60px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        
        .cta a:hover {
            transform: translateY(-3px);
        }
        
        .promo {
            text-align: center;
            color: white;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            border: 2px dashed rgba(255,255,255,0.4);
        }
        
        .promo .code {
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍 Маркетплейс</h1>
        <p>Покупай и продавай прямо в Telegram</p>
    </div>

    <div class="container">
        <div class="stats" id="stats"></div>
        <div class="grid" id="grid">
            <div class="loading">⏳ Загрузка товаров...</div>
        </div>

        <div class="cta">
            <a href="https://t.me/@marketplohadka_bot" id="bot-link">🚀 Открыть бота в Telegram</a>
            <div class="promo">
                <div>🎁 Бонус новичкам</div>
                <div class="code">WELCOME50</div>
                <div>+50₽ на баланс</div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ЗАМЕНИ ЭТИ 2 СТРОКИ НА СВОИ ДАННЫЕ:
        const BOT_USERNAME = '@marketplohadka_bot';  // username бота БЕЗ @
        const API_URL = 'https://marketplace-bot-r89u.onrender.com';  // твой Render URL

        // Обновляем ссылку на бота
        document.getElementById('bot-link').href = `https://t.me/${BOT_USERNAME}`;

        async function loadProducts() {
            const grid = document.getElementById('grid');
            const stats = document.getElementById('stats');
            
            try {
                const res = await fetch(API_URL + '/api/products');
                const products = await res.json();
                
                if (!products || products.length === 0) {
                    grid.innerHTML = '<div class="empty">😢 Пока нет товаров<br><br>Заходи в бота и выложи первый!</div>';
                    stats.textContent = '';
                    return;
                }
                
                stats.textContent = `📦 Товаров в каталоге: ${products.length}`;
                
                grid.innerHTML = products.map(p => `
                    <div class="card">
                        <h3>${escapeHtml(p.title)}</h3>
                        <div class="desc">${escapeHtml(p.description)}</div>
                        <div class="price">${p.price}₽</div>
                        <a class="buy" href="https://t.me/${BOT_USERNAME}?start=buy_${p.id}">
                            💳 Купить в боте
                        </a>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="empty">❌ Ошибка загрузки<br><br>Попробуй обновить страницу</div>';
                stats.textContent = '';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadProducts();
        setInterval(loadProducts, 30000);
    </script>
</body>
</html>
